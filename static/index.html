<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALAK — WA Mass Reporter</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#131313; --panel-2:#1a1a1a; --border:#262626;
    --text:#dcdcdc; --muted:#666; --accent:#ff6b1a; --ok:#00cc66;
    --warn:#ffaa00; --fail:#ff3344; --mono:'JetBrains Mono','Fira Code',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;
    overflow:hidden;
  }
  .app{
    display:grid;grid-template-columns:420px 1fr;grid-template-rows:56px 1fr;
    height:100vh;
  }
  header{
    grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;background:var(--panel);border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:0.5px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent)}
  .brand .sub{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
  .status{display:flex;align-items:center;gap:16px;font-size:12px}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--fail)}
  .status-dot.online{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .btn{
    padding:8px 16px;border-radius:6px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);font-weight:600;font-size:12px;
    cursor:pointer;transition:all .15s;letter-spacing:0.5px;
  }
  .btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .btn:disabled{opacity:0.4;cursor:not-allowed}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#000}
  .btn.primary:hover:not(:disabled){background:#ff8544;border-color:#ff8544;color:#000}
  .btn.danger{border-color:var(--fail);color:var(--fail)}
  .btn.danger:hover:not(:disabled){background:var(--fail);color:#fff}
  .config{background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:16px;}
  .section{margin-bottom:18px}
  .section h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px;font-weight:600;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;color:var(--muted)}
  .field input,.field textarea{
    background:var(--panel-2);border:1px solid var(--border);border-radius:4px;
    color:var(--text);padding:8px 10px;font-size:12px;font-family:inherit;transition:border-color .15s;
  }
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:80px;font-family:var(--mono);font-size:11px;line-height:1.5;}
  .checkbox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .checkbox input{accent-color:var(--accent)}
  .actions{display:flex;gap:8px;margin-top:16px}
  .actions .btn{flex:1}
  .main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
  .stats{padding:20px 24px;background:var(--panel);border-bottom:1px solid var(--border);}
  .stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:16px;}
  .stat{display:flex;flex-direction:column;gap:4px}
  .stat .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
  .stat .value{font-size:22px;font-weight:700;font-family:var(--mono)}
  .stat .value.ok{color:var(--ok)}
  .stat .value.fail{color:var(--fail)}
  .stat .value.accent{color:var(--accent)}
  .progress-wrap{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;position:relative;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),#ff9a4a);width:0%;transition:width .3s ease;box-shadow:0 0 12px var(--accent);}
  .progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;font-family:var(--mono);}
  .log-header{padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .log-header .title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:600}
  .log-actions{display:flex;gap:8px}
  #log{flex:1;overflow-y:auto;padding:12px 24px;font-family:var(--mono);font-size:12px;line-height:1.7;background:#0d0d0d;}
  #log::-webkit-scrollbar{width:10px}
  #log::-webkit-scrollbar-track{background:#0d0d0d}
  #log::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
  #log::-webkit-scrollbar-thumb:hover{background:#3a3a3a}
  .line{white-space:pre-wrap;word-break:break-word}
  .ts{color:#3a3a3a;margin-right:8px}
  .lvl{display:inline-block;width:48px;font-weight:700;margin-right:4px}
  .INFO{color:#8a8a8a}
  .OK{color:var(--ok)}
  .FAIL,.ERROR{color:var(--fail)}
  .WARN{color:var(--warn)}
  .lvl.OK{color:var(--ok)}
  .lvl.FAIL,.lvl.ERROR{color:var(--fail)}
  .lvl.WARN{color:var(--warn)}
  .empty{color:var(--muted);font-style:italic;text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="dot"></span> GALAK <span class="sub">· WA MASS REPORTER</span>
    </div>
    <div class="status">
      <span><span class="status-dot" id="wsDot"></span> WS</span>
      <span id="jobStatus" style="color:var(--muted)">IDLE</span>
      <button class="btn" onclick="logout()" style="padding:4px 10px; font-size:11px;">LOGOUT</button>
    </div>
  </header>

  <aside class="config">
    <div class="section">
      <h3>Target & Jumlah</h3>
      <div class="field">
        <label>Nomor WhatsApp Target</label>
        <input id="cfgTarget" placeholder="628123456789" value="">
      </div>
      <div class="row" style="margin-top:8px">
        <div class="field"><label>Total Report</label><input id="cfgTotal" type="number" value="100"></div>
        <div class="field"><label>Per Akun (Max)</label><input id="cfgPerAcct" type="number" value="50"></div>
      </div>
    </div>

    <div class="section">
      <h3>Delay (Detik)</h3>
      <div class="row">
        <div class="field"><label>Report Min</label><input id="cfgRMin" type="number" value="30"></div>
        <div class="field"><label>Report Max</label><input id="cfgRMax" type="number" value="120"></div>
      </div>
      <div class="row">
        <div class="field"><label>Akun Min</label><input id="cfgAMin" type="number" value="60"></div>
        <div class="field"><label>Akun Max</label><input id="cfgAMax" type="number" value="180"></div>
      </div>
    </div>

    <div class="section">
      <h3>Proxies (1 per baris)</h3>
      <div class="field"><textarea id="cfgProxies" placeholder="http://user:pass@1.2.3.4:8080"></textarea></div>
    </div>

    <div class="section">
      <h3>Akun (1 nomor per baris)</h3>
      <div class="field"><textarea id="cfgAccounts" placeholder="6281111111111&#10;6282222222222"></textarea></div>
    </div>

    <div class="section">
      <label class="checkbox">
        <input type="checkbox" id="cfgHeadless" checked>
        Headless (matikan buat scan QR live)
      </label>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnStart">START</button>
      <button class="btn danger" id="btnStop" disabled>STOP</button>
    </div>
  </aside>

  <main class="main">
    <div class="stats">
      <div class="stats-grid">
        <div class="stat"><span class="label">Target</span><span class="value accent" id="stTotal">0</span></div>
        <div class="stat"><span class="label">Terkirim</span><span class="value" id="stSent">0</span></div>
        <div class="stat"><span class="label">OK</span><span class="value ok" id="stOk">0</span></div>
        <div class="stat"><span class="label">Gagal</span><span class="value fail" id="stFail">0</span></div>
        <div class="stat"><span class="label">Akun</span><span class="value" id="stAcct">0/0</span></div>
      </div>
      <div class="progress-wrap"><div class="progress-bar" id="progBar"></div></div>
      <div class="progress-label">
        <span id="progText">0%</span>
        <span id="progCount">0 / 0</span>
      </div>
    </div>

    <div class="log-header">
      <span class="title">Live Log</span>
      <div class="log-actions"><button class="btn" id="btnClear">CLEAR</button></div>
    </div>
    <div id="log"><div class="empty">belum ada aktivitas</div></div>
  </main>
</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const state = { ws: null, running: false, reconnectDelay: 1000, stats: {} };
  
  // AMBIL URL BACKEND DARI LOCALSTORAGE
  const backendUrl = localStorage.getItem('backendUrl');
  if (!backendUrl) {
    window.location.href = '/login.html'; // Tendang ke login kalau belum set
    return;
  }
  
  // Ubah http ke ws
  const wsUrl = backendUrl.replace(/^http/, 'ws');

  function setWsStatus(online){
    const d = $('wsDot');
    d.classList.toggle('online', online);
  }

  function connect(){
    state.ws = new WebSocket(`${wsUrl}/ws`);
    state.ws.onopen = () => { state.reconnectDelay = 1000; setWsStatus(true); };
    state.ws.onclose = () => {
      setWsStatus(false);
      setTimeout(connect, state.reconnectDelay);
      state.reconnectDelay = Math.min(state.reconnectDelay * 2, 10000);
    };
    state.ws.onerror = () => setWsStatus(false);
    state.ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch(e){ return; }
      if (msg.type === 'log') addLog(msg.data.level, msg.data.msg);
      else if (msg.type === 'stats') updateStats(msg.data);
      else if (msg.type === 'done'){
        state.running = false; setRunning(false);
        addLog('INFO', 'Job selesai.');
      }
    };
  }

  function addLog(level, msg){
    const log = $('log');
    if (log.querySelector('.empty')) log.innerHTML = '';
    const ts = new Date().toTimeString().slice(0,8);
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = `<span class="ts">${ts}</span><span class="lvl ${level}">${level}</span><span class="${level}">${escapeHtml(msg)}</span>`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function updateStats(s){
    if (!s) return;
    state.stats = { ...state.stats, ...s };
    const st = state.stats;
    $('stTotal').textContent = st.total || 0;
    $('stSent').textContent  = st.sent || 0;
    $('stOk').textContent    = st.success || 0;
    $('stFail').textContent  = st.failed || 0;
    $('stAcct').textContent  = `${st.accounts_done||0}/${st.accounts_total||0}`;
    const pct = st.total ? Math.min(100, (st.sent / st.total) * 100) : 0;
    $('progBar').style.width = pct.toFixed(2) + '%';
    $('progText').textContent = pct.toFixed(1) + '%';
    $('progCount').textContent = `${st.sent||0} / ${st.total||0}`;
  }

  function setRunning(r){
    state.running = r;
    $('btnStart').disabled = r;
    $('btnStop').disabled = !r;
    $('jobStatus').textContent = r ? 'RUNNING' : 'IDLE';
    $('jobStatus').style.color = r ? 'var(--ok)' : 'var(--muted)';
  }

  async function logout() {
    try {
      await fetch(`${backendUrl}/api/logout`, { method: 'POST', credentials: 'include' });
      localStorage.removeItem('backendUrl');
      window.location.href = '/login.html';
    } catch(e) { 
      localStorage.removeItem('backendUrl');
      window.location.href = '/login.html'; 
    }
  }
  window.logout = logout;

  function collectConfig(){
    const target = $('cfgTarget').value.trim();
    const proxies = $('cfgProxies').value.trim();
    const accounts = $('cfgAccounts').value.trim();
    if (!target) return { error: 'target kosong' };
    if (!proxies) return { error: 'proxies kosong' };
    if (!accounts) return { error: 'accounts kosong' };
    return {
      target,
      total_reports:        parseInt($('cfgTotal').value, 10) || 100,
      reports_per_account:  parseInt($('cfgPerAcct').value, 10) || 50,
      report_delay_min:     parseInt($('cfgRMin').value, 10) || 30,
      report_delay_max:     parseInt($('cfgRMax').value, 10) || 120,
      account_delay_min:    parseInt($('cfgAMin').value, 10) || 60,
      account_delay_max:    parseInt($('cfgAMax').value, 10) || 180,
      proxies, accounts,
      headless: $('cfgHeadless').checked,
    };
  }

  async function startJob(){
    const cfg = collectConfig();
    if (cfg.error){ addLog('ERROR', cfg.error); return; }
    try {
      const res = await fetch(`${backendUrl}/api/start`, {
        method:'POST', 
        headers:{'Content-Type':'application/json'},
        credentials: 'include',
        body: JSON.stringify(cfg),
      });
      const data = await res.json();
      if (data.ok){ setRunning(true); addLog('INFO', 'Job dimulai...'); }
      else { addLog('ERROR', data.error || 'gagal start'); }
    } catch(e){ addLog('ERROR', 'request gagal: ' + e.message); }
  }

  async function stopJob(){
    try {
      const res = await fetch(`${backendUrl}/api/stop`, { 
        method:'POST',
        credentials: 'include'
      });
      const data = await res.json();
      if (data.ok) addLog('WARN', 'Stop diminta. Tunggu step selesai...');
      else addLog('ERROR', data.error || 'gagal stop');
    } catch(e){ addLog('ERROR', 'request gagal: ' + e.message); }
  }

  $('btnStart').addEventListener('click', startJob);
  $('btnStop').addEventListener('click', stopJob);
  $('btnClear').addEventListener('click', () => {
    $('log').innerHTML = '<div class="empty">belum ada aktivitas</div>';
  });

  (async function hydrate(){
    try {
      const res = await fetch(`${backendUrl}/api/stats`, { credentials: 'include' });
      const data = await res.json();
      if (data.stats) updateStats(data.stats);
      if (data.running) setRunning(true);
    } catch(e){}
  })();

  connect();
})();
</script>
</body>
        </html>
