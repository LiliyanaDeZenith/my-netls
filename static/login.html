<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALAK — Login</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#131313; --border:#262626;
    --text:#dcdcdc; --muted:#666; --accent:#ff6b1a; --fail:#ff3344;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    background:var(--bg);color:var(--text);height:100vh;
    display:flex;align-items:center;justify-content:center;
  }
  .login-box{
    background:var(--panel);border:1px solid var(--border);
    padding:40px;border-radius:12px;width:100%;max-width:400px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  .brand{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-weight:700;letter-spacing:0.5px;margin-bottom:30px;font-size:18px;
  }
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 10px var(--accent)}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .field label{font-size:12px;color:var(--muted)}
  .field input{
    background:var(--bg);border:1px solid var(--border);border-radius:6px;
    color:var(--text);padding:12px;font-size:14px;transition:border-color .15s;
  }
  .field input:focus{outline:none;border-color:var(--accent)}
  .btn{
    width:100%;padding:12px;border-radius:6px;border:none;
    background:var(--accent);color:#000;font-weight:700;font-size:14px;
    cursor:pointer;transition:all .15s;margin-top:10px;
  }
  .btn:hover{background:#ff8544}
  .error{color:var(--fail);font-size:12px;text-align:center;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="login-box">
  <div class="brand"><span class="dot"></span> GALAK</div>
  
  <div class="field">
    <label>Backend URL (Link Cloudflare Tunnel)</label>
    <input type="url" id="backendUrl" placeholder="https://xxxx.trycloudflare.com">
  </div>
  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="genshinimpectc5@gmail.com" autocomplete="username">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  
  <button class="btn" id="btnLogin">MASUK</button>
  <div class="error" id="errMsg">Email atau Password salah.</div>
</div>

<script>
  // Load URL backend dari memori kalau udah pernah masuk
  const savedBackend = localStorage.getItem('backendUrl');
  if (savedBackend) document.getElementById('backendUrl').value = savedBackend;

  const btn = document.getElementById('btnLogin');
  const err = document.getElementById('errMsg');

  async function doLogin(){
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'MEMPROSES...';
    
    let backendUrl = document.getElementById('backendUrl').value.trim();
    if (!backendUrl) {
      err.textContent = 'Backend URL wajib diisi!';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'MASUK';
      return;
    }
    // Hapus slash di akhir biar rapi
    backendUrl = backendUrl.replace(/\/$/, "");
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const res = await fetch(`${backendUrl}/api/login`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        credentials: 'include', // PENTING: biar cookie session masuk
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      
      if(data.ok) {
        localStorage.setItem('backendUrl', backendUrl);
        window.location.href = '/'; // Pindah ke index
      } else {
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'MASUK';
      }
    } catch(e) {
      err.textContent = 'Gagal konek ke Backend URL. Cek link tunnel lo.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'MASUK';
    }
  }

  btn.addEventListener('click', doLogin);
  document.getElementById('password').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
